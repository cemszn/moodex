<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moodex</title>
  <link rel="stylesheet" href="moodex.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="logo">Moodex</div>
    <div class="header-right">
      <div class="header-date" id="hDate"></div>
      <div class="streak" id="hStreak"></div>
    </div>
  </header>

  <div class="pages">

    <!-- ════ LOG PAGE ════ -->
    <div class="page" id="page-log">

      <div class="section-label">How are you feeling?</div>
      <div class="mood-grid" id="moodGrid"></div>

      <div class="section-label" id="intLabel" style="display:none">Intensities</div>
      <div id="moodIntRows"></div>

      <div class="section-label">Journal Entry</div>
      <div class="journal-card">
        <textarea class="journal-ta" id="journalTa"
          placeholder="What's on your mind? (optional)" maxlength="300" rows="4"></textarea>
        <div class="journal-footer">
          <span class="char-count"><span id="cCount">0</span> / 300</span>
          <i class="fa-solid fa-pen" style="width:14px;height:14px;color:var(--muted)"></i>
        </div>
      </div>

      <button class="log-btn" id="logBtn">Log Mood</button>

    </div>

    <!-- ════ SETTINGS PAGE ════ -->
    <div class="page hidden" id="page-settings">

      <div class="section-label">Appearance</div>
      <div class="setting-card">
        <div class="setting-row">
          <div class="setting-left">
            <div class="setting-icon" id="themeIconWrap">
              <i class="fa-solid fa-moon" style="color:#A66CFF"></i>
            </div>
            <div>
              <div class="setting-title">Theme</div>
              <div class="setting-sub" id="themeSub">Dark mode</div>
            </div>
          </div>
          <label class="tog">
            <input type="checkbox" id="themeCheck">
            <span class="tog-track"><span class="tog-knob"></span></span>
          </label>
        </div>
      </div>

      <div class="settings-about">
        <div class="logo">Moodex</div>
        <p>Track your emotional journey</p>
      </div>

    </div>

    <!-- ════ TRACK PAGE ════ -->
    <div class="page hidden" id="page-track">

      <div class="track-tabs" id="trackTabs">
        <div class="ttab active" data-tab="overview">Overview</div>
        <div class="ttab" data-tab="calendar">Calendar</div>
        <div class="ttab" data-tab="history">History</div>
      </div>

      <!-- Overview -->
      <div id="view-overview">
        <div class="radar-card">
          <div class="radar-card-title">Mood Spider — avg. intensity per mood</div>
          <canvas id="radarCanvas"></canvas>
        </div>

        <div class="chart-card">
          <div class="chart-label">Last 7 Days</div>
          <div class="bars-wrap" id="barsWrap"></div>
        </div>

        <div class="section-label">Mood Breakdown</div>
        <div id="distWrap" style="display:flex;flex-direction:column;gap:8px;"></div>

        <div class="section-label">Recent Entries</div>
        <div class="entry-list" id="recentList"></div>
      </div>

      <!-- Calendar -->
      <div id="view-calendar" style="display:none">
        <div class="cal-card">
          <div class="cal-head">
            <button class="cal-arrow" id="calPrev"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="cal-month" id="calTitle"></div>
            <button class="cal-arrow" id="calNext"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="cal-wdays">
            <div class="cal-wd">Su</div><div class="cal-wd">Mo</div><div class="cal-wd">Tu</div>
            <div class="cal-wd">We</div><div class="cal-wd">Th</div><div class="cal-wd">Fr</div>
            <div class="cal-wd">Sa</div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div id="calDetail"></div>
      </div>

      <!-- History -->
      <div id="view-history" style="display:none">
        <div class="entry-list" id="historyList" style="margin-top:16px;"></div>
      </div>

    </div>

  </div><!-- /pages -->

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-log"><i class="fa-solid fa-pen-to-square"></i> Log</button>
    <button class="nav-item" id="nav-track"><i class="fa-solid fa-chart-line"></i> Track</button>
    <button class="nav-item" id="nav-settings"><i class="fa-solid fa-gear"></i> Settings</button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="success-overlay" id="successOverlay">
    <div class="success-ring" id="successRing"></div>
  </div>

</div><!-- /app -->

<script src="moodex.js"></script>
</body>
</html>
