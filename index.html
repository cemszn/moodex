<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moodex</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e0e16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moodex">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="moodex.css?v=26">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" media="print" onload="this.media='all'" crossorigin="anonymous">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous"></noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>
</head>
<body>

<!-- ════ SPLASH SCREEN ════ -->
<div id="splash-screen">
  <div id="splash-lottie"></div>
</div>

<!-- ════ LOGIN SCREEN ════ -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="logo">Moodex</div>
    <p class="login-sub">Track your emotional journey</p>
    <label class="sr-only" for="loginEmail">Email address</label>
    <input class="login-input" type="email" id="loginEmail"
      placeholder="Email" autocomplete="email" inputmode="email">
    <label class="sr-only" for="loginPass">Password</label>
    <input class="login-input" type="password" id="loginPass"
      placeholder="Password" autocomplete="current-password">
    <div class="login-err" id="loginErr"></div>
    <button class="log-btn" id="loginBtn">Sign In</button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="app" style="display:none">

  <div class="content-area">

  <header class="app-header">
    <div class="logo">Moodex</div>
    <div class="header-right">
      <div class="header-date" id="hDate"></div>
      <div class="streak" id="hStreak"></div>
    </div>
  </header>

  <div class="pages">

    <!-- ════ LOG PAGE ════ -->
    <div class="page" id="page-log">

      <div class="log-hero" id="logHero"></div>
      <div class="mood-grid" id="moodGrid"></div>

      <div id="intSection">
        <div id="intSectionInner">
          <div class="section-label">Intensities</div>
          <div id="moodIntRows"></div>
        </div>
      </div>

      <div class="section-label">Journal Entry</div>
      <div class="journal-card">
        <textarea class="journal-ta" id="journalTa"
          placeholder="What's on your mind? (optional)" maxlength="300" rows="4"></textarea>
        <div class="journal-footer">
          <span class="char-count"><span id="cCount">0</span> / 300</span>
          <i class="fa-solid fa-pen" style="font-size:13px;color:var(--muted)"></i>
        </div>
      </div>

      <button class="log-btn" id="logBtn">Log Mood</button>

    </div>

    <!-- ════ SETTINGS PAGE ════ -->
    <div class="page hidden" id="page-settings">

      <div class="section-label">Appearance</div>
      <div class="setting-card">
        <div class="setting-row">
          <div class="setting-left">
            <div class="setting-icon" id="themeIconWrap">
              <i class="fa-solid fa-moon" style="color:#A66CFF"></i>
            </div>
            <div>
              <div class="setting-title">Theme</div>
              <div class="setting-sub" id="themeSub">Dark mode</div>
            </div>
          </div>
          <label class="tog">
            <input type="checkbox" id="themeCheck">
            <span class="tog-track"><span class="tog-knob"></span></span>
          </label>
        </div>
      </div>

      <div class="section-label">Account</div>
      <div class="setting-card">
        <button class="setting-row" id="signOutRow" type="button">
          <div class="setting-left">
            <div class="setting-icon" style="background:#FF6B6B22">
              <i class="fa-solid fa-right-from-bracket" style="color:#FF6B6B"></i>
            </div>
            <div>
              <div class="setting-title">Sign Out</div>
              <div class="setting-sub" id="userEmailSub">—</div>
            </div>
          </div>
        </button>
      </div>

      <div class="settings-about">
        <div class="logo">Moodex</div>
        <p>Track your emotional journey</p>
      </div>

    </div>

    <!-- ════ TRACK PAGE ════ -->
    <div class="page hidden" id="page-track">

      <div class="track-tabs" id="trackTabs" role="tablist" aria-label="Track views">
        <button class="ttab active" data-tab="overview" type="button" role="tab" aria-selected="true">Overview</button>
        <button class="ttab" data-tab="calendar" type="button" role="tab" aria-selected="false">Calendar</button>
        <button class="ttab" data-tab="history" type="button" role="tab" aria-selected="false">History</button>
      </div>

      <!-- Overview -->
      <div id="view-overview">
        <div class="section-label">Mood Spider</div>
        <canvas id="radarCanvas"></canvas>
        <div class="section-label">Mood Breakdown</div>
        <div id="distWrap"></div>
        <div class="section-label">Recent Entries</div>
        <div class="entry-list" id="recentList"></div>
      </div>

      <!-- Calendar -->
      <div id="view-calendar" style="display:none">
        <div class="cal-card">
          <div class="cal-head">
            <button class="cal-arrow" id="calPrev"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="cal-month" id="calTitle"></div>
            <button class="cal-arrow" id="calNext"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="cal-wdays">
            <div class="cal-wd">Su</div><div class="cal-wd">Mo</div><div class="cal-wd">Tu</div>
            <div class="cal-wd">We</div><div class="cal-wd">Th</div><div class="cal-wd">Fr</div>
            <div class="cal-wd">Sa</div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div id="calDetail"></div>
      </div>

      <!-- History -->
      <div id="view-history" style="display:none">
        <div class="entry-list" id="historyList" style="margin-top:16px;"></div>
      </div>

    </div>

  </div><!-- /pages -->

  </div><!-- /content-area -->

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="success-overlay" id="successOverlay">
    <div class="success-ring" id="successRing"></div>
  </div>

  <!-- NAV — absolute within #app so it respects content max-width -->
  <div id="navWrap" style="display:none">
    <div class="fab-nav" id="fabNav">
      <div class="fab-menu" id="fabMenu">
        <button class="fab-menu-item" id="nav-log"><i class="fa-solid fa-pen-to-square"></i><span>Log</span></button>
        <button class="fab-menu-item" id="nav-track"><i class="fa-solid fa-chart-line"></i><span>Track</span></button>
        <button class="fab-menu-item" id="nav-settings"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
      </div>
      <button class="fab-btn" id="fabBtn" aria-label="Open navigation">
        <i class="fab-icon fab-icon-menu fa-solid fa-bars"></i>
        <i class="fab-icon fab-icon-close fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

</div><!-- /app -->


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
<script type="module" src="moodex.js"></script>
</body>
</html>
